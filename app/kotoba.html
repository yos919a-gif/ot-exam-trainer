<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  :root{ --bg:#f6f7fb; --card:#fff; --card2:#f9fafc; --ink:#1d2433; --sub:#5b6577; --accent:#2f6fed; --accent2:#e8f0fe; --accent3:#c9d8fb; --line:#e3e7ef; --warm:#b7591f; --warm2:#fbeee4; --shadow:0 1px 2px rgba(20,30,60,.06); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#141822; --card:#1d2433; --card2:#222a3b; --ink:#e8ecf4; --sub:#9aa5b8; --accent:#6b9bff; --accent2:#243352; --accent3:#33466e; --line:#2c3547; --warm:#f0a070; --warm2:#3a2a20; } }
  :root[data-theme="dark"]{ --bg:#141822; --card:#1d2433; --card2:#222a3b; --ink:#e8ecf4; --sub:#9aa5b8; --accent:#6b9bff; --accent2:#243352; --accent3:#33466e; --line:#2c3547; --warm:#f0a070; --warm2:#3a2a20; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;line-height:1.8;padding:0 16px 48px}
  main{max-width:1000px;margin:0 auto}
  .head{padding:22px 0 10px;display:flex;gap:8px 16px;align-items:baseline;flex-wrap:wrap}
  .head h1{font-size:21px;margin:0;border-left:4px solid var(--accent);padding-left:12px}
  .sub{color:var(--sub);font-size:13px}
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
  .side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:calc(var(--appbar-height,56px) + 8px)}
  @media(max-width:760px){.side{position:static}}
  #q{width:100%;min-height:46px;font-size:16px;padding:10px 12px;border:2px solid var(--accent3);border-radius:8px;background:var(--card);color:var(--ink)}
  #q:focus{outline:3px solid color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent)}
  #list{max-height:60vh;overflow:auto;margin-top:8px}
  @media(max-width:760px){#list{max-height:36vh}}
  #list button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;padding:6px 8px;border-radius:6px;cursor:pointer}
  #list button:hover{background:var(--accent2)} #list button[aria-current="true"]{background:var(--accent);color:#fff}
  #list .c{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums} #list button[aria-current="true"] .c{color:inherit}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
  .card h2{font-size:22px;margin:0} .pg{color:var(--sub);font-size:13px;margin-left:8px}
  .ex{margin:12px 0;padding:10px 14px;background:var(--card2);border-left:3px solid var(--accent3);border-radius:4px;font-size:15px;line-height:1.95;overflow-wrap:anywhere}
  .ex .h{font-weight:700;display:block} .ex .p{color:var(--sub);font-size:12px;margin-left:4px}
  .ex mark{background:var(--accent2);color:inherit;border-radius:3px;padding:0 2px;cursor:pointer}
  h3{font-size:15px;margin:18px 0 6px;display:flex;gap:8px;align-items:baseline} h3 small{color:var(--sub);font-weight:400;font-size:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--accent3);background:var(--card);color:var(--accent);border-radius:999px;padding:3px 12px;font:inherit;font-size:14px;cursor:pointer}
  .chip.use{border-color:color-mix(in srgb,var(--warm) 45%,var(--line));color:var(--warm);background:var(--warm2)}
  .chip:hover{filter:brightness(.95)} .chip:focus-visible,#list button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .none{color:var(--sub);font-size:13px}
  .crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--sub);margin-bottom:8px}
  .crumb button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
  .ob{margin-top:4px} .obt{font-size:13px;font-weight:700;color:var(--sub);margin-top:12px}
  .ex.ex2{border-left-color:color-mix(in srgb,var(--warm) 55%,var(--line))}
  .chip .ob1{font-size:11px;margin-left:4px;opacity:.75}
  .note{font-size:12px;color:var(--sub);margin-top:14px;border-top:1px dashed var(--line);padding-top:8px}
  /* スマホでは一覧・関連語を44px以上にし、長い語と見出しを折り返す。 */
  @media(max-width:640px){
    .layout,.side,.card{min-width:0}.head{padding-top:16px}.head h1{font-size:19px}
    #list{max-height:32vh;max-height:32dvh;overscroll-behavior:contain}
    #list button{min-height:44px;font-size:16px;line-height:1.65;padding:9px 8px;margin-block:4px}
    #list button>span:first-child{min-width:0;overflow-wrap:anywhere}
    #list .c{flex-shrink:0;padding-top:3px}
    .card{padding:16px 14px;scroll-margin-top:calc(var(--appbar-height) + 12px);overflow-wrap:anywhere}
    .card h2{font-size:21px;line-height:1.7}.pg{display:block;margin:4px 0 0;font-size:13px;font-weight:400}
    .ex{font-size:16px;line-height:1.9;padding:12px}
    h3{flex-wrap:wrap;gap:2px 8px;font-size:16px;line-height:1.8}h3 small{flex-basis:100%;font-size:13px}
    .chips{gap:8px}.chip{min-height:44px;max-width:100%;padding:8px 12px;font-size:16px;line-height:1.6;overflow-wrap:anywhere}
    .crumb{gap:4px 8px;line-height:1.8}.crumb button{min-width:44px;min-height:44px;padding:7px 6px;font-size:14px;max-width:100%;overflow-wrap:anywhere}
    .note{font-size:13px;line-height:1.85}.note a{display:inline-block;min-height:44px;padding-block:8px}
  }
.att{display:flex;align-items:baseline;gap:6px;margin:2px 0}.att .hd{font-size:12px;opacity:.7;min-width:3em}.att .raw{font-size:14px;padding:4px 2px}
  .rel{display:inline-block;min-width:1.6em;text-align:center;font-weight:700;margin-right:4px;color:var(--sub)}
  .grp{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}.grp .lab{font-size:12px;color:var(--sub);flex:0 0 auto}
  .card,.chips{min-width:0;max-width:100%}.chip{max-width:100%;overflow-wrap:anywhere}
  .flow .chip.f-分岐{border-color:#2e8b57;color:#2e8b57}.flow .chip.f-合流{border-color:#8a5cc2;color:#8a5cc2}.flow .chip.f-順路{border-color:var(--accent3);color:var(--accent)}
  .tree{margin:8px 0 0;padding-left:0;list-style:none;font-size:15px}
  .tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}
  .tree li{margin:2px 0}.tree .k{font-size:11px;color:var(--sub);margin-right:4px}
  .tree button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:2px 0;text-align:left}
  .tbtn{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:8px;font:inherit;font-size:13px;padding:4px 10px;cursor:pointer;margin-right:6px}
  h4{font-size:14px;margin:12px 0 4px;display:flex;gap:8px;align-items:baseline} h4 small{color:var(--sub);font-weight:400;font-size:12px}
  @media(max-width:640px){.tbtn{min-height:44px;font-size:15px}.tree button{min-height:40px;font-size:16px}h4{flex-wrap:wrap;font-size:15px}h4 small{flex-basis:100%;font-size:13px}}

<body>
<header class="appbar"><div class="wrap">
  <a class="brand" href="index.html"><span class="logo">OT</span><span><b>国試トレーナー</b><small>第50〜61回・2,400問（公式正答準拠）</small></span></a>

</div></header>

<main>
  <div class="head"><h1>語のつながり</h1><span class="sub" id="info">読み込み中…</span></div>
  <div class="layout">
    <div class="side">
      <input type="search" id="q" placeholder="語を入力（例: ホルモン、大動脈弓、上腕二頭筋）" autocomplete="off">
      <div class="sub" style="margin-top:6px">数字＝この語を使って説明される語の数＋下位・下流の語の数</div>
      <div id="list"></div>
    </div>
    <div class="card" id="card"><p class="none">左の一覧から語を選んでください。</p></div>
  </div>
</main>
<script src="content.js"></script>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="textbook.js"></script>
<script>
"use strict";
// 語のつながり（旧「語の網」と統合）。
// 1) 教科書の説明の文 2) 語どうしの関係（⊂ ∈ ＝ 流れ ほか） 3) 説明に出てくる語（つながり）
// 教科書の索引の語ごとに、原本で字まで確かめた説明の文と、語どうしのつながり（説明に出てくる語）。tools/build_term_links.py が作る
let T = {}, META = {}, A = {}, KEYS = [], trail = [];
const BOOK = {anatomy:"解剖学", physiology:"生理学", b032:"運動学"};
const esc = t => String(t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kata = s => s.replace(/[ぁ-ゖ]/g, c=>String.fromCharCode(c.charCodeAt(0)+0x60));
const fold = s => kata(s.normalize("NFKC").toLowerCase().replace(/\s/g,""));
const tidy = s => s.replace(/[ 　\t]+/g," ").replace(/(?<![A-Za-z0-9]) | (?![A-Za-z0-9])/g,"").trim();
const known = w => !!(T[w] || A[w]);
const spec = w => (T[w] ? T[w]["使われる"].length : 0);  // 少ないほど専門的な語
const nrel = w => { const t = A[w]; return t ? (t.子||[]).length + (t.下流||[]).length : 0; };

function renderList(){
  const q = fold(document.getElementById("q").value);
  let hit = KEYS.filter(k=>!q || fold(k).includes(q));
  hit.sort((a,b)=>(fold(b)===q)-(fold(a)===q) || fold(b).startsWith(q)-fold(a).startsWith(q) || (spec(b)+nrel(b))-(spec(a)+nrel(a)) || a.localeCompare(b,"ja"));
  const cur = trail[trail.length-1];
  document.getElementById("list").innerHTML = hit.slice(0,300).map(k=>
    `<button type="button" data-w="${esc(k)}" aria-current="${k===cur}"><span>${esc(k)}</span><span class="c">${(spec(k)+nrel(k))||""}</span></button>`).join("");
}
function chips(ws, cls){
  if(!ws.length) return `<span class="none">見つけられない（この本の説明の文の中では）</span>`;
  return `<div class="chips">${[...ws].sort((a,b)=>spec(a)-spec(b)).map(w=>`<button type="button" class="chip ${cls}" data-w="${esc(w)}">${esc(w)}${T[w]&&T[w]["他の本"]?`<span class="ob1">＋${T[w]["他の本"].length}冊</span>`:""}</button>`).join("")}</div>`;
}
const chip = (w, cls="") => `<button type="button" class="chip ${cls}" data-w="${esc(w)}">${esc(w)}</button>`;
function pages(t){
  return Object.entries(t.p||{}).filter(([,ps])=>ps&&ps.length).map(([b,ps])=>`${BOOK[b]||b} p.${ps.slice(0,4).join(", ")}`).join("　");
}
function group(list, lab){
  if(!list.length) return "";
  return `<div class="grp"><span class="lab">${lab}</span><span class="chips" style="display:contents">${list.map(x=>chip(x)).join("")}</span></div>`;
}
function flowChips(list){
  return `<div class="chips flow">${list.map(([k,w])=>`<button type="button" class="chip f-${esc(k)}" data-w="${esc(w)}" title="${esc(k)}"><span class="rel">${k==="分岐"?"⑂":k==="合流"?"⑃":"→"}</span>${esc(w)}</button>`).join("")}</div>`;
}
function tree(w, dir, depth=0, seen=new Set([w])){
  const t = A[w]; if(!t || depth>12) return "";
  const nx = (dir==="下流" ? t.下流 : t.上流).filter(([,v])=>!seen.has(v));
  if(!nx.length) return "";
  nx.forEach(([,v])=>seen.add(v));
  return `<ul>${nx.map(([k,v])=>`<li><span class="k">${esc(k)}</span><button type="button" data-w="${esc(v)}">${esc(v)}</button>${tree(v,dir,depth+1,seen)}</li>`).join("")}</ul>`;
}
// (1) 教科書の説明の文
function secExplain(w){
  const t = T[w];
  if(!t) return `<h3>教科書の説明 <small>この語の説明の文</small></h3><p class="none">この語は教科書の索引にありません（下の関係だけ記録されています）。</p>`;
  const linked = new Set(t["出てくる"]);
  // 長い語から先に、一度だけ当てる（色を付けた所にもう一度当てない）
  const marks = [...linked].sort((a,b)=>b.length-a.length);
  const rx = marks.length ? new RegExp("(" + marks.map(m=>m.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|") + ")", "g") : null;
  const markUp = s => { const u = tidy(s); if(!rx) return esc(u);
    return u.split(rx).map((part,i)=> i%2 ? `<mark data-w="${esc(part)}">${esc(part)}</mark>` : esc(part)).join(""); };
  const ex = !t["説明"] ? `<span class="none">説明の文は基本辞書を取り込むと出ます（ホームの「教科書データ」）。索引 p.${t.p.join(", ")}</span>` : t["説明"].map(o=> o["見出し"] ? `<span class="h">${esc(tidy(o["文"]))}</span>` : `${markUp(o["文"])}<span class="p">（p.${esc(o.p)}）</span>`).join(" ");
  return `<h3>教科書の説明 <small>原本で字まで確かめた文</small></h3>
     ${(t["他の本"]||[]).length?`<div class="obt">${esc(META["本"]||"")}</div>`:""}
     <div class="ex">${ex}</div>
     ${(t["他の本"]||[]).map(o=>`<div class="ob"><div class="obt">${esc(o["本"])}${o["語"]!==w?`（${esc(o["語"])}）`:""}</div><div class="ex ex2">${!o["説明"] ? `<span class="none">p.${(o.p||[]).join(", ")}（文は基本辞書を取り込むと出ます）</span>` : o["説明"].map(x=> x["見出し"] ? `<span class="h">${esc(tidy(x["文"]))}</span>` : `${markUp(x["文"])}<span class="p">（p.${esc(x.p)}）</span>`).join(" ")}</div></div>`).join("")}`;
}
// (2) 語どうしの関係（⊂ 一種, ∈ 部分, ＝ 同じもの, 流れ, 起始・停止, 神経）
function secRelations(w){
  const t = A[w];
  let h = `<h3>語どうしの関係 <small>⊂ 一種　∈ 部分　＝ 同じもの　／　流れ: 分岐・合流・順路</small></h3>`;
  if(!t) return h + `<p class="none">この語の関係はまだ記録されていません。</p>`;
  const par = t.親||[], kids = t.子||[], same = t.同じ||[], up = t.上流||[], down = t.下流||[];
  if(same.length) h += `<h4>同じもの <small>別の呼び名</small></h4><div class="chips">${same.map(x=>chip(x)).join("")}</div>`;
  if(par.length) h += `<h4>上の語 <small>${esc(w)} は …</small></h4>` + group(par.filter(x=>x[0]==="⊂").map(x=>x[1]),"⊂ の一種") + group(par.filter(x=>x[0]==="∈").map(x=>x[1]),"∈ の部分");
  if(kids.length) h += `<h4>下の語 <small>${esc(w)} の …</small></h4>` + group(kids.filter(x=>x[0]==="⊂").map(x=>x[1]),"一種 ⊃") + group(kids.filter(x=>x[0]==="∈").map(x=>x[1]),"部分 ∋");
  if(up.length || down.length){
    h += `<h4>流れ <small>⑂分岐 ⑃合流 →順路</small></h4>`;
    if(up.length) h += `<div class="lab sub">上流（ここへ流れてくる）</div>` + flowChips(up);
    if(down.length) h += `<div class="lab sub" style="margin-top:6px">下流（ここから流れていく）</div>` + flowChips(down);
    h += `<div style="margin-top:8px">${down.length?`<button type="button" class="tbtn" data-tree="下流">下流をたどる</button>`:""}${up.length?`<button type="button" class="tbtn" data-tree="上流">上流をたどる</button>`:""}</div><div id="tree"></div>`;
  }
  // 起始・停止（筋のカード）と、付く筋・靱帯（骨・部位のカード）。表示は紙面の字、語があれば押せる
  const site = ([txt, to, head]) => `<div class="att">${head?`<span class="hd">${esc(head)}</span>`:""}${to && known(to) ? `<button type="button" class="chip" data-w="${esc(to)}">${esc(txt)}</button>` : `<span class="raw">${esc(txt)}</span>`}</div>`;
  const ATT = ["起始","停止","付着"].filter(k=>(t[k]||[]).length);
  if(ATT.length) h += `<h4>起始・停止 <small>筋頭があれば頭ごと</small></h4>` + ATT.map(k=>`<div class="grp"><span class="lab">${k}</span><div>${t[k].map(site).join("")}</div></div>`).join("");
  if((t.付く||[]).length){
    h += `<h4>ここに付く筋・靱帯</h4>` + ["起始","停止","付着"].map(k=>{ const L = t.付く.filter(x=>x[0]===k); return L.length ? `<div class="grp"><span class="lab">${k}</span><span class="chips" style="display:contents">${L.map(([,m,who,txt])=>`<button type="button" class="chip" data-w="${esc(m)}" title="${esc(txt)}">${esc(who)}</button>`).join("")}</span></div>` : ""; }).join("");
  }
  // 神経の支配（筋のカードに支配神経、神経のカードに支配する筋と髄節）
  const link2 = ([txt, to]) => to && known(to) ? `<button type="button" class="chip" data-w="${esc(to)}">${esc(txt)}</button>` : `<span class="chip raw">${esc(txt)}</span>`;
  const INN = (t.支配神経||[]).length + (t.支配する筋||[]).length + (t.髄節||[]).length;
  if(INN){
    h += `<h4>神経の支配</h4>`;
    if((t.支配神経||[]).length) h += `<div class="grp"><span class="lab">支配神経</span><span class="chips" style="display:contents">${t.支配神経.map(link2).join("")}</span></div>`;
    if((t.支配する筋||[]).length) h += `<div class="grp"><span class="lab">支配する筋</span><span class="chips" style="display:contents">${t.支配する筋.map(link2).join("")}</span></div>`;
    if((t.髄節||[]).length) h += `<div class="grp"><span class="lab">髄節</span><span>${t.髄節.map(esc).join("、")}</span></div>`;
  }
  if(!par.length && !kids.length && !up.length && !down.length && !same.length && !ATT.length && !(t.付く||[]).length && !INN) h += `<p class="none">この語の型のある関係はまだ記録されていません。</p>`;
  return h;
}
// (3) 説明に出てくる語（つながり）
function secLinks(w){
  const t = T[w], a = A[w];
  const extra = ((a && a.つながり) || []).filter(x=>!t || !(t["出てくる"]||[]).includes(x));
  let h = "";
  if(t){
    h += `<h3>説明に出てくる語 <small>この語を理解するのに使われている語</small></h3>${chips(t["出てくる"],"")}
     <h3>この語を使って説明される語 <small>この語が土台になっている語（${t["使われる"].length}語）</small></h3>${chips(t["使われる"],"use")}`;
  }
  if(extra.length) h += `<h3>つながり <small>説明の中に出てくる語</small></h3><div class="chips">${extra.slice(0,60).map(x=>chip(x,"use")).join("")}</div>`;
  if(!h) h = `<h3>つながり <small>説明の中に出てくる語</small></h3><p class="none">記録されていません。</p>`;
  return h;
}
function show(w, push=true){
  if(!known(w)) return;
  const t = T[w], a = A[w];
  if(push){ if(trail[trail.length-1]!==w) trail.push(w); if(trail.length>12) trail.shift(); }
  const pg = t ? `${META["本"]||""} 索引 p.${t.p.join(", ")}` : "";
  const apg = a ? pages(a) : "";
  const card = document.getElementById("card");
  card.dataset.w = w;
  card.innerHTML =
    `${trail.length>1?`<div class="crumb">たどった語: ${trail.map((x,i)=>i<trail.length-1?`<button type="button" data-w="${esc(x)}" data-back="${i}">${esc(x)}</button> ›`:`<b>${esc(x)}</b>`).join(" ")}</div>`:""}
     <h2>${esc(w)}<span class="pg">${esc([pg, apg].filter(Boolean).join("　"))}</span></h2>
     ${secExplain(w)}
     ${secRelations(w)}
     ${secLinks(w)}
     <div class="note">説明の文は、教科書の原本の画像から書き写し、字まで確かめた文です。つながりは、その文の中に索引の語が出てくることを表します。「＋1冊」はほかの教科書の説明（同じく原本で確かめた文）もある語です。語どうしの関係は、教科書3冊（解剖学・生理学・運動学）の紙面から2人で読み取り、意味を確かめた関係だけです。<a href="sakuin.html?q=${encodeURIComponent(w)}">総合索引でほかの本を見る</a></div>`;
  renderList();
  const u = new URL(location); u.searchParams.set("w", w); u.searchParams.delete("q"); history.replaceState(null,"",u);
}
document.addEventListener("click", e=>{
  const tb = e.target.closest("[data-tree]");
  if(tb){ const w = document.getElementById("card").dataset.w; const el = document.getElementById("tree");
    el.innerHTML = `<div class="sub">${tb.dataset.tree}をたどる</div><div class="tree">${tree(w, tb.dataset.tree) || "（ここまで）"}</div>`; return; }
  const b = e.target.closest("[data-w]"); if(!b || !known(b.dataset.w)) return;
  if(b.dataset.back!==undefined){ trail = trail.slice(0, +b.dataset.back+1); show(b.dataset.w,false); return; }
  show(b.dataset.w);
  if(window.innerWidth<=760) document.getElementById("card").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("q").addEventListener("input", renderList);
// つながり・索引ページ・説明の文・語どうしの関係はどれも基本辞書（教科書データの辞書_kotoba_…json。tools/bundle_textbook.py が作る）に入っていて、
// 取り込んだ人にだけ出す。公開サイトには置かない。?local=1 は手元の確認用（関係だけ ../content/knowledge/ami.json から読む）
let FULL = false;
(async ()=>{
  try{ if(window.TEXTBOOK) await TEXTBOOK.load(); }catch(e){ console.warn(e); }
  const params = new URL(location).searchParams;
  const d = window.TEXTBOOK && TEXTBOOK.kotobaLinks("physiology");
  let ad = null;
  if(params.get("local")==="1"){
    try{ ad = await (await fetch("../content/knowledge/ami.json")).json(); }catch(e){ ad = null; }
  }
  if(!ad && window.TEXTBOOK && TEXTBOOK.ami) ad = TEXTBOOK.ami();
  if(!d && !ad){
    document.getElementById("info").textContent = "";
    document.getElementById("card").textContent = "語のつながりは、基本辞書を取り込んだ人だけが使えます（ホームの「教科書データ」から）。";
    const lb = window.TEXTBOOK && TEXTBOOK.loginButton && TEXTBOOK.loginButton(); if(lb) document.getElementById("card").appendChild(lb);
    if(window.TEXTBOOK && TEXTBOOK.diag){ const dg = document.createElement("div"); dg.style.cssText = "margin-top:14px;font-size:12px;opacity:.7"; dg.textContent = TEXTBOOK.diag(); document.getElementById("card").appendChild(dg); }
    return;
  }
  if(d){
    T = d.terms; META = d.meta;
    try{
      const full = window.TEXTBOOK && TEXTBOOK.kotoba && TEXTBOOK.kotoba(META.id || "physiology");
      if(full && full.terms){
        FULL = true;
        Object.keys(T).forEach(w=>{ const f = full.terms[w]; if(!f) return; T[w]["説明"] = f["説明"]; if(f["他の本"]) T[w]["他の本"] = f["他の本"]; });
      }
    }catch(e){ console.warn("基本辞書", e); }
  }
  if(ad) A = ad.語 || {};
  KEYS = [...new Set([...Object.keys(T), ...Object.keys(A)])];
  const nl = d && META["つながり数"] ? `・つながり ${META["つながり数"].toLocaleString()}本` : "";
  document.getElementById("info").textContent = `${KEYS.length.toLocaleString()}語` + nl +
    (d && !FULL ? "（説明の文は基本辞書を取り込むと出ます）" : "");
  renderList();
  const p = new URLSearchParams(location.search);
  const w0 = p.get("w"), q0 = p.get("q");
  if(q0){ document.getElementById("q").value = q0; renderList(); }
  if(w0 && known(w0)) show(w0);
  else if(q0 && known(q0)) show(q0);
})().catch(e=>{ document.getElementById("card").textContent = "読み込めませんでした: " + e; });
</script>
