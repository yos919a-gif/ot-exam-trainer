<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon.png">
<title>語の網</title>
<style>
  :root{ --bg:#f6f7fb; --card:#fff; --card2:#f9fafc; --ink:#1d2433; --sub:#5b6577; --accent:#2f6fed; --accent2:#e8f0fe; --accent3:#c9d8fb; --line:#e3e7ef; --warm:#b7591f; --warm2:#fbeee4; --shadow:0 1px 2px rgba(20,30,60,.06); }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#141822; --card:#1d2433; --card2:#222a3b; --ink:#e8ecf4; --sub:#9aa5b8; --accent:#6b9bff; --accent2:#243352; --accent3:#33466e; --line:#2c3547; --warm:#f0a070; --warm2:#3a2a20; } }
  :root[data-theme="dark"]{ --bg:#141822; --card:#1d2433; --card2:#222a3b; --ink:#e8ecf4; --sub:#9aa5b8; --accent:#6b9bff; --accent2:#243352; --accent3:#33466e; --line:#2c3547; --warm:#f0a070; --warm2:#3a2a20; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;line-height:1.8;padding:0 16px 48px}
  main{max-width:1000px;margin:0 auto}
  .head{padding:22px 0 10px;display:flex;gap:8px 16px;align-items:baseline;flex-wrap:wrap}
  .head h1{font-size:21px;margin:0;border-left:4px solid var(--accent);padding-left:12px}
  .sub{color:var(--sub);font-size:13px}
  .layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:760px){.layout{grid-template-columns:minmax(0,1fr)}}
  .side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:calc(var(--appbar-height,56px) + 8px)}
  @media(max-width:760px){.side{position:static}}
  #q{width:100%;min-height:46px;font-size:16px;padding:10px 12px;border:2px solid var(--accent3);border-radius:8px;background:var(--card);color:var(--ink)}
  #q:focus{outline:3px solid color-mix(in srgb,var(--accent) 22%,transparent);border-color:var(--accent)}
  #list{max-height:60vh;overflow:auto;margin-top:8px}
  @media(max-width:760px){#list{max-height:36vh}}
  #list button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;padding:6px 8px;border-radius:6px;cursor:pointer}
  #list button:hover{background:var(--accent2)} #list button[aria-current="true"]{background:var(--accent);color:#fff}
  #list .c{color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums} #list button[aria-current="true"] .c{color:inherit}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
  .card h2{font-size:22px;margin:0} .pg{color:var(--sub);font-size:13px;margin-left:8px}
  .ex{margin:12px 0;padding:10px 14px;background:var(--card2);border-left:3px solid var(--accent3);border-radius:4px;font-size:15px;line-height:1.95;overflow-wrap:anywhere}
  .ex .h{font-weight:700;display:block} .ex .p{color:var(--sub);font-size:12px;margin-left:4px}
  .ex mark{background:var(--accent2);color:inherit;border-radius:3px;padding:0 2px;cursor:pointer}
  h3{font-size:15px;margin:18px 0 6px;display:flex;gap:8px;align-items:baseline} h3 small{color:var(--sub);font-weight:400;font-size:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--accent3);background:var(--card);color:var(--accent);border-radius:999px;padding:3px 12px;font:inherit;font-size:14px;cursor:pointer}
  .chip.use{border-color:color-mix(in srgb,var(--warm) 45%,var(--line));color:var(--warm);background:var(--warm2)}
  .chip:hover{filter:brightness(.95)} .chip:focus-visible,#list button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .none{color:var(--sub);font-size:13px}
  .crumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--sub);margin-bottom:8px}
  .crumb button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
  .ob{margin-top:4px} .obt{font-size:13px;font-weight:700;color:var(--sub);margin-top:12px}
  .ex.ex2{border-left-color:color-mix(in srgb,var(--warm) 55%,var(--line))}
  .chip .ob1{font-size:11px;margin-left:4px;opacity:.75}
  .note{font-size:12px;color:var(--sub);margin-top:14px;border-top:1px dashed var(--line);padding-top:8px}
  /* スマホでは一覧・関連語を44px以上にし、長い語と見出しを折り返す。 */
  @media(max-width:640px){
    .layout,.side,.card{min-width:0}.head{padding-top:16px}.head h1{font-size:19px}
    #list{max-height:32vh;max-height:32dvh;overscroll-behavior:contain}
    #list button{min-height:44px;font-size:16px;line-height:1.65;padding:9px 8px;margin-block:4px}
    #list button>span:first-child{min-width:0;overflow-wrap:anywhere}
    #list .c{flex-shrink:0;padding-top:3px}
    .card{padding:16px 14px;scroll-margin-top:calc(var(--appbar-height) + 12px);overflow-wrap:anywhere}
    .card h2{font-size:21px;line-height:1.7}.pg{display:block;margin:4px 0 0;font-size:13px;font-weight:400}
    .ex{font-size:16px;line-height:1.9;padding:12px}
    h3{flex-wrap:wrap;gap:2px 8px;font-size:16px;line-height:1.8}h3 small{flex-basis:100%;font-size:13px}
    .chips{gap:8px}.chip{min-height:44px;max-width:100%;padding:8px 12px;font-size:16px;line-height:1.6;overflow-wrap:anywhere}
    .crumb{gap:4px 8px;line-height:1.8}.crumb button{min-width:44px;min-height:44px;padding:7px 6px;font-size:14px;max-width:100%;overflow-wrap:anywhere}
    .note{font-size:13px;line-height:1.85}.note a{display:inline-block;min-height:44px;padding-block:8px}
  }
</style>
<link rel="stylesheet" href="appbar.css">
<style>
  .rel{display:inline-block;min-width:1.6em;text-align:center;font-weight:700;margin-right:4px;color:var(--sub)}
  .grp{margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}.grp .lab{font-size:12px;color:var(--sub);flex:0 0 auto}
  .card,.chips{min-width:0;max-width:100%}.chip{max-width:100%;overflow-wrap:anywhere}
  .flow .chip.f-分岐{border-color:#2e8b57;color:#2e8b57}.flow .chip.f-合流{border-color:#8a5cc2;color:#8a5cc2}.flow .chip.f-順路{border-color:var(--accent3);color:var(--accent)}
  .legend{font-size:12px;color:var(--sub);margin-top:6px}
  .tree{margin:8px 0 0;padding-left:0;list-style:none;font-size:15px}
  .tree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}
  .tree li{margin:2px 0}.tree .k{font-size:11px;color:var(--sub);margin-right:4px}
  .tree button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:2px 0;text-align:left}
  .tbtn{border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:8px;font:inherit;font-size:13px;padding:4px 10px;cursor:pointer;margin-right:6px}
  @media(max-width:640px){.tbtn{min-height:44px;font-size:15px}.tree button{min-height:40px;font-size:16px}}
</style>
</head>
<body>
<header class="appbar"><div class="wrap">
  <a class="brand" href="index.html"><span class="logo">OT</span><span><b>国試トレーナー</b><small>第50〜61回・2,400問（公式正答準拠）</small></span></a>
  <nav class="tabs"><a href="index.html">ホーム</a><a href="graph.html">語マップ</a><a href="sakuin.html">総合索引</a><a href="kotoba.html">語のつながり</a><a href="ami.html" class="on">語の網</a></nav>
</div></header>
<main>
  <div class="head"><h1>語の網</h1><span class="sub" id="info">読み込み中…</span></div>
  <div class="layout">
    <div class="side">
      <input type="search" id="q" placeholder="語を入力（例: 大動脈弓、上腕二頭筋）" autocomplete="off">
      <div class="sub" style="margin-top:6px">⊂ 一種　∈ 部分　＝ 同じもの　／　流れ: 分岐・合流・順路</div>
      <div id="list"></div>
    </div>
    <div class="card" id="card">語を選んでください。</div>
  </div>
  <div class="note">教科書3冊（解剖学・生理学・運動学）の紙面から2人で読み取り、意味を確かめた関係だけを載せています。本文は載せていません。</div>
</main>
<script src="content.js"></script>
<script src="config.js"></script>
<script src="sync.js"></script>
<script src="textbook.js"></script>
<script>
"use strict";
const BOOK = {anatomy:"解剖学", physiology:"生理学", b032:"運動学"};
let A = null, KEYS = [], trail = [];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chip = (w, cls="") => `<button class="chip ${cls}" data-w="${esc(w)}">${esc(w)}</button>`;
function renderList(){
  const q = document.getElementById("q").value.trim();
  const hit = q ? KEYS.filter(w => w.includes(q)).sort((a,b)=> (a.startsWith(q)?0:1)-(b.startsWith(q)?0:1) || a.length-b.length) : KEYS.slice(0,0);
  document.getElementById("list").innerHTML = (q ? hit.slice(0,200) : []).map(w => {
    const t = A[w], n = t.子.length + t.下流.length;
    return `<button data-w="${esc(w)}" aria-current="${w===trail[trail.length-1]}"><span>${esc(w)}</span><span class="c">${n||""}</span></button>`;
  }).join("") || `<div class="none">${q ? "見つかりません" : "語を入力すると候補が出ます"}</div>`;
}
function pages(t){
  return Object.entries(t.p||{}).filter(([,ps])=>ps&&ps.length).map(([b,ps])=>`${BOOK[b]||b} p.${ps.slice(0,4).join(", ")}`).join("　");
}
function group(list, lab){
  if(!list.length) return "";
  return `<div class="grp"><span class="lab">${lab}</span><span class="chips" style="display:contents">${list.map(x=>chip(x)).join("")}</span></div>`;
}
function flowChips(list){
  return `<div class="chips flow">${list.map(([k,w])=>`<button class="chip f-${esc(k)}" data-w="${esc(w)}" title="${esc(k)}"><span class="rel">${k==="分岐"?"⑂":k==="合流"?"⑃":"→"}</span>${esc(w)}</button>`).join("")}</div>`;
}
function tree(w, dir, depth=0, seen=new Set([w])){
  const t = A[w]; if(!t || depth>12) return "";
  const nx = (dir==="下流" ? t.下流 : t.上流).filter(([,v])=>!seen.has(v));
  if(!nx.length) return "";
  nx.forEach(([,v])=>seen.add(v));
  return `<ul>${nx.map(([k,v])=>`<li><span class="k">${esc(k)}</span><button data-w="${esc(v)}">${esc(v)}</button>${tree(v,dir,depth+1,seen)}</li>`).join("")}</ul>`;
}
function show(w, push=true){
  const t = A[w]; if(!t) return;
  if(push){ if(trail[trail.length-1]!==w) trail.push(w); if(trail.length>12) trail.shift(); }
  const par = t.親, kids = t.子;
  let h = trail.length>1 ? `<div class="crumb">${trail.map((x,i)=> i<trail.length-1 ? `<button data-w="${esc(x)}" data-back="${i}">${esc(x)}</button> ›` : `<b>${esc(x)}</b>`).join(" ")}</div>` : "";
  h += `<h2>${esc(w)}</h2><div class="sub">${esc(pages(t)) || "（ページの記録なし）"}</div>`;
  if(t.同じ.length) h += `<h3>同じもの <small>別の呼び名</small></h3><div class="chips">${t.同じ.map(x=>chip(x)).join("")}</div>`;
  if(par.length) h += `<h3>上の語 <small>${esc(w)} は …</small></h3>` + group(par.filter(x=>x[0]==="⊂").map(x=>x[1]),"⊂ の一種") + group(par.filter(x=>x[0]==="∈").map(x=>x[1]),"∈ の部分");
  if(kids.length) h += `<h3>下の語 <small>${esc(w)} の …</small></h3>` + group(kids.filter(x=>x[0]==="⊂").map(x=>x[1]),"一種 ⊃") + group(kids.filter(x=>x[0]==="∈").map(x=>x[1]),"部分 ∋");
  if(t.上流.length || t.下流.length){
    h += `<h3>流れ <small>⑂分岐 ⑃合流 →順路</small></h3>`;
    if(t.上流.length) h += `<div class="lab sub">上流（ここへ流れてくる）</div>` + flowChips(t.上流);
    if(t.下流.length) h += `<div class="lab sub" style="margin-top:6px">下流（ここから流れていく）</div>` + flowChips(t.下流);
    h += `<div style="margin-top:8px">${t.下流.length?`<button class="tbtn" data-tree="下流">下流をたどる</button>`:""}${t.上流.length?`<button class="tbtn" data-tree="上流">上流をたどる</button>`:""}</div><div id="tree"></div>`;
  }
  if(t.つながり.length) h += `<h3>つながり <small>説明の中に出てくる語</small></h3><div class="chips">${t.つながり.slice(0,60).map(x=>chip(x,"use")).join("")}</div>`;
  if(!par.length && !kids.length && !t.上流.length && !t.下流.length && !t.同じ.length && !t.つながり.length) h += `<p class="none">この語の関係はまだ記録されていません。</p>`;
  const card = document.getElementById("card"); card.innerHTML = h; card.dataset.w = w;
  renderList();
  const u = new URL(location); u.searchParams.set("w", w); history.replaceState(null,"",u);
}
document.addEventListener("click", e=>{
  const tb = e.target.closest("[data-tree]");
  if(tb){ const w = document.getElementById("card").dataset.w; const el = document.getElementById("tree");
    el.innerHTML = `<div class="sub">${tb.dataset.tree}をたどる</div><div class="tree">${tree(w, tb.dataset.tree) || "（ここまで）"}</div>`; return; }
  const b = e.target.closest("[data-w]"); if(!b || !A[b.dataset.w]) return;
  if(b.dataset.back!==undefined){ trail = trail.slice(0, +b.dataset.back+1); show(b.dataset.w,false); return; }
  show(b.dataset.w);
  if(window.innerWidth<=760) document.getElementById("card").scrollIntoView({behavior:"smooth",block:"start"});
});
document.getElementById("q").addEventListener("input", renderList);
// 網は教科書由来なので公開サイトに置かず、基本辞書（辞書_kotoba_…json）を取り込んだ人にだけ出す。?local=1 は手元の確認用
(async ()=>{
  let d = null;
  if(new URL(location).searchParams.get("local")==="1"){
    try{ d = await (await fetch("../content/knowledge/ami.json")).json(); }catch(e){ d = null; }
  }
  if(!d && window.TEXTBOOK){ await TEXTBOOK.load(); d = TEXTBOOK.ami ? TEXTBOOK.ami() : null; }
  if(!d){
    document.getElementById("info").textContent = "";
    document.getElementById("card").textContent = "語の網には基本辞書が必要です。ホームの「教科書データ」から基本辞書（辞書_kotoba_…）を取り込んでください。";
    const lb = window.TEXTBOOK && TEXTBOOK.loginButton && TEXTBOOK.loginButton(); if(lb) document.getElementById("card").appendChild(lb);
    return;
  }
  A = d.語; KEYS = Object.keys(A).sort();
  document.getElementById("info").textContent = `${KEYS.length.toLocaleString()} 語`;
  const w = new URL(location).searchParams.get("w");
  if(w && A[w]) show(w); else renderList();
})();
</script>
</body>
</html>
